<!-- Fragmento #1 que irá en el head de todas las páginas, así se incluye todo lo necesario de configuración-->
<head th:fragment="head">
    <title>CaninoShop</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<!-- Encabezado y menú -->


<header th:fragment="header"
        class="container-fluid p-0"
        xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center text-success fw-semibold" th:href="@{/}">
                <span class="d-inline-flex align-items-center justify-content-center rounded bg-success text-white fw-bold me-2"
                      style="width: 32px; height: 32px; font-size: .75rem;">CS</span>
                CaninoShop
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#caninoNavbar" aria-controls="caninoNavbar"
                    aria-expanded="false" aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="caninoNavbar">
                <div class="navbar-nav ms-lg-auto align-items-lg-center gap-lg-1">
                    <a class="nav-link px-lg-2" th:href="@{/}">Inicio</a>
                    <!-- Visitantes sin iniciar sesión -->
                    <a sec:authorize="isAnonymous()" class="nav-link px-lg-2"
                       th:href="@{/registro/nuevo}">Crear cuenta</a>
                    <a sec:authorize="isAnonymous()" class="nav-link px-lg-2 text-success fw-semibold"
                       th:href="@{/login}">Iniciar sesión</a>

                    <!-- Pedidos personales para cualquier usuario autenticado -->
                    <a sec:authorize="hasRole('CLIENTE')" class="nav-link px-lg-2"
                       th:href="@{/mispedidos/listado}">
                        <i class="fa-solid fa-box me-1"></i> [[#{menu.mispedidos}]]
                    </a>

                    <!-- Gestión global de pedidos, solo para administradores -->
                    <a sec:authorize="hasAnyRole('ADMIN','ENCARGADO')" class="nav-link px-lg-2"
                       th:href="@{/pedido/listado}">
                        [[#{menu.pedidos}]]
                    </a>

                    <a sec:authorize="hasAnyRole('ADMIN','ENCARGADO')" class="nav-link px-lg-2"
                       th:href="@{/producto/administrar}">[[#{menu.productos}]]</a>

                    <a sec:authorize="hasRole('ADMIN')" class="nav-link px-lg-2"
                       th:href="@{/categoria/listado}">[[#{menu.categorias}]]</a>

                    <a sec:authorize="hasRole('CLIENTE')" class="nav-link px-lg-2"
                       th:href="@{/carrito/listado}">
                        <i class="fa-solid fa-cart-shopping me-1"></i> [[#{menu.carrito}]]
                        <span class="badge rounded-pill text-bg-warning"
                              th:if="${cantidadCarrito != null and cantidadCarrito > 0}"
                              th:text="${cantidadCarrito}"></span>
                    </a>
                </div>

                <div sec:authorize="isAuthenticated()"
                     class="d-flex flex-column flex-sm-row align-items-sm-center gap-2 ms-lg-3 py-2 py-lg-0">
                    <div class="d-flex align-items-center gap-2">
                        <span class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success"
                              style="width: 34px; height: 34px;">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <span class="d-flex flex-column lh-sm" style="max-width: 190px;">
                            <span class="text-muted small">Usuario</span>
                            <strong class="small text-dark text-truncate"
                                    style="max-width: 190px;"
                                    sec:authentication="name"></strong>
                        </span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary btn-sm w-100">
                            Cerrar sesión
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </nav>

</header>




<!-- Derechos de autor -->
<footer th:fragment="footer"
        class="container-fluid text-center py-4 mt-auto"
        style="background-color: #e6eee4; color: #315c43;">
    <small>&copy; 2026 CaninoShop. Todos los derechos reservados.</small>
</footer>
