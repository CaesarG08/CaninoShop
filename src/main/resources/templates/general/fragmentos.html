<!-- Fragmento #1 que irá en el head de todas las páginas, así se incluye todo lo necesario de configuración-->
<head th:fragment="head">
    <title>CaninoShop</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
</head>

<!-- Encabezado y menú -->


<header th:fragment="header"
        class="container-fluid p-0"
        xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">

            <a class="navbar-brand" th:href="@{/}">
                CaninoShop
            </a>

            <div class="d-flex gap-2 align-items-center">

                <a class="btn btn-outline-light btn-sm"
                   th:href="@{/}">
                    Inicio
                </a>

                <!-- Visitantes sin iniciar sesion -->
                <a sec:authorize="isAnonymous()"
                   class="btn btn-outline-light btn-sm"
                   th:href="@{/registro/nuevo}">
                    Crear cuenta
                </a>

                <a sec:authorize="isAnonymous()"
                   class="btn btn-light btn-sm"
                   th:href="@{/login}">
                    Iniciar sesión
                </a>

                <!-- Nombre del usuario autenticado -->
                <span sec:authorize="isAuthenticated()"
                      class="text-white me-2">
                    Usuario:
                    <strong sec:authentication="name"></strong>
                </span>

                <!-- Cerrar sesion -->
                <form sec:authorize="isAuthenticated()"
                      th:action="@{/logout}"
                      method="post"
                      class="d-inline">

                    <button type="submit"
                            class="btn btn-light btn-sm">
                        Cerrar sesión
                    </button>

                </form>

            </div>
        </div>
    </nav>

</header>




<!-- Derechos de autor -->
<footer th:fragment="footer"
        class="container-fluid text-center py-4 mt-5"
        style="background-color: #e6eee4; color: #315c43;">

</footer>
