<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container my-5">
    <div class="row"><div class="col-lg-6 mx-auto"><div class="card">
        <div class="card-header bg-success text-white"><h4>Activar doble autenticación</h4></div>
        <div class="card-body text-center">
            <p>Abre Google Authenticator o Microsoft Authenticator, añade una cuenta y escanea este QR.</p>
            <img th:src="'data:image/png;base64,' + ${qrBase64}" alt="QR para activar 2FA"
                 width="240" height="240" class="img-fluid mb-3"/>
            <p class="small text-muted">Si no puedes escanearlo, introduce esta clave manualmente en tu aplicación:</p>
            <p class="font-monospace text-break" th:text="${secreto}"></p>
            <p>Escribe el código de seis dígitos de la aplicación para terminar la configuración.</p>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form method="post" th:action="@{/seguridad/2fa/activar}">
                <label for="codigo" class="form-label">Código del autenticador</label>
                <input id="codigo" name="codigo" type="text" class="form-control mx-auto mb-3 text-center"
                       style="max-width:240px" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{6}" maxlength="6" required autofocus/>
                <button class="btn btn-success" type="submit">Activar y continuar</button>
            </form>
            <form method="post" th:action="@{/seguridad/2fa/cancelar}" class="mt-3">
                <button type="submit" class="btn btn-outline-secondary btn-sm">Cancelar inicio de sesión</button>
            </form>
            <p class="text-muted small mt-3">Intentos restantes: <span th:text="${intentosRestantes}"></span></p>
        </div>
    </div></div></div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body></html>
