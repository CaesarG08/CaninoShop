<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{general/fragmentos :: head}"></head>
<body>
<header th:replace="~{general/fragmentos :: header}"></header>
<main class="container my-5">
    <div class="row"><div class="col-lg-6 mx-auto"><div class="card">
        <div class="card-header bg-success text-white"><h4>Verificación de seguridad</h4></div>
        <div class="card-body">
            <p>Introduce el código de tu aplicación autenticadora para finalizar el inicio de sesión.</p>
            <p class="small text-muted">También puedes utilizar un código de recuperación, una sola vez.</p>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <form method="post" th:action="@{/seguridad/2fa/verificar}">
                <label for="codigo" class="form-label">Código de verificación</label>
                <input id="codigo" name="codigo" type="text" class="form-control mb-3"
                       maxlength="13" autocomplete="one-time-code" required autofocus
                       placeholder="6 dígitos o XXXXXX-XXXXXX"/>
                <button class="btn btn-success" type="submit">Verificar y entrar</button>
            </form>
            <form method="post" th:action="@{/seguridad/2fa/cancelar}" class="mt-3">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Cancelar inicio de sesión</button>
            </form>
            <p class="text-muted small mt-3">Intentos restantes: <span th:text="${intentosRestantes}"></span></p>
        </div>
    </div></div></div>
</main>
<footer th:replace="~{general/fragmentos :: footer}"></footer>
</body></html>
