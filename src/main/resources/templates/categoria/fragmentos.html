<section xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
         th:fragment="listado">
    <div class="bg-success text-white py-2">
        <div class="container">
            <h1 class="h5 mb-0">[[#{categoria.titulo}]]</h1>
        </div>
    </div>

    <div class="container py-4">
        <div th:replace="~{carrito/fragmentos :: alertas}"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h2 class="h6 mb-0" th:if="${categoria.idCategoria == null}">[[#{categoria.agregar}]]</h2>
                <h2 class="h6 mb-0" th:unless="${categoria.idCategoria == null}">[[#{categoria.editar}]]</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/categoria/guardar}" method="post" th:object="${categoria}"
                      class="row g-3">
                    <input type="hidden" th:field="*{idCategoria}"/>
                    <div class="col-md-5">
                        <label for="nombreCategoria" class="form-label">[[#{categoria.nombre}]]</label>
                        <input id="nombreCategoria" type="text" class="form-control"
                               th:field="*{nombre}" maxlength="100" required/>
                    </div>
                    <div class="col-md-5">
                        <label for="descripcionCategoria" class="form-label">[[#{categoria.descripcion}]]</label>
                        <input id="descripcionCategoria" type="text" class="form-control"
                               th:field="*{descripcion}" maxlength="255"/>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input id="categoriaActiva" type="checkbox" class="form-check-input"
                                   th:field="*{activo}"/>
                            <label for="categoriaActiva" class="form-check-label">[[#{categoria.activa}]]</label>
                        </div>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success">[[#{accion.guardar}]]</button>
                        <a th:href="@{/categoria/listado}" class="btn btn-outline-secondary"
                           th:if="${categoria.idCategoria != null}">[[#{accion.cancelar}]]</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive" th:if="${categorias != null and !categorias.isEmpty()}">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>[[#{categoria.nombre}]]</th>
                                <th>[[#{categoria.descripcion}]]</th>
                                <th>[[#{categoria.estado}]]</th>
                                <th class="text-end">[[#{pedido.columna.accion}]]</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="categoriaItem : ${categorias}">
                                <td th:text="${categoriaItem.nombre}"></td>
                                <td th:text="${categoriaItem.descripcion}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${categoriaItem.activo ? 'text-bg-success' : 'text-bg-secondary'}"
                                          th:text="${categoriaItem.activo ? #messages.msg('categoria.activa') : #messages.msg('categoria.inactiva')}"></span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-2">
                                        <a th:href="@{/categoria/listado(editar=${categoriaItem.idCategoria})}"
                                           class="btn btn-outline-primary btn-sm">[[#{accion.actualizar}]]</a>
                                        <form th:if="${categoriaItem.activo}"
                                              th:action="@{/categoria/desactivar}" method="post">
                                            <input type="hidden" name="idCategoria"
                                                   th:value="${categoriaItem.idCategoria}"/>
                                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                                [[#{categoria.desactivar}]]
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="text-center text-muted mb-0" th:if="${categorias == null or categorias.isEmpty()}">
                    [[#{categoria.vacio}]]
                </p>
            </div>
        </div>
    </div>
</section>
